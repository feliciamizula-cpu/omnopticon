# Source of truth for incremental Argus CI/CD impact detection.
# Service keys intentionally match Docker Compose service names and Kubernetes deployment names.
version: 1
solution: eShop.slnx
registryImagePrefix: ${REGISTRY}

globalPaths:
  allApps:
    - Directory.Build.props
    - Directory.Build.targets
    - Directory.Packages.props
    - global.json
    - nuget.config
    - NuGet.config
    - deploy/Dockerfile.service
    - .ci/service-map.yml
    - scripts/ci/**
  fullTopology:
    - src/Argus.AppHost/**
    - deploy/terraform/**
    - deploy/patch-node-selectors.py
    - deploy/patch-secrets.py
    - deploy/compose*.yaml
    - .github/workflows/cd-gcp.yml

sharedProjects:
  service-defaults:
    project: src/Argus.ServiceDefaults/Argus.ServiceDefaults.csproj
    paths:
      - src/Argus.ServiceDefaults/**
    affects: all-runnable

  contracts:
    project: src/Contracts/Argus.Contracts/Argus.Contracts.csproj
    paths:
      - src/Contracts/Argus.Contracts/**
      - src/Contracts/**
    affects: referenced-by

  artifacts:
    project: src/BuildingBlocks/Argus.BuildingBlocks.Artifacts/Argus.BuildingBlocks.Artifacts.csproj
    paths:
      - src/BuildingBlocks/Argus.BuildingBlocks.Artifacts/**
    affects: referenced-by

  event-bus:
    project: src/BuildingBlocks/Argus.BuildingBlocks.EventBus/Argus.BuildingBlocks.EventBus.csproj
    paths:
      - src/BuildingBlocks/Argus.BuildingBlocks.EventBus/**
    affects: referenced-by

  event-driven-workers:
