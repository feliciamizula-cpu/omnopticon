  workers:
    project: src/BuildingBlocks/Argus.BuildingBlocks.Workers/Argus.BuildingBlocks.Workers.csproj
    paths:
      - src/BuildingBlocks/Argus.BuildingBlocks.Workers/**
    affects: referenced-by

services:
  agent-service:
    kind: service
    project: src/Services/Argus.AgentService/Argus.AgentService.csproj
    assembly: Argus.AgentService
    image: agent-service
    composeService: agent-service
    kubernetesDeployment: agent-service
    kubernetesContainer: agent-service
    paths:
      - src/Services/Argus.AgentService/**
    tests:
      - tests/Argus.AgentService.Tests/Argus.AgentService.Tests.csproj
    healthUrl: /health

  program-scope-service:
    kind: service
