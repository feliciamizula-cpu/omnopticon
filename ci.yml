trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: BuildConfiguration
    value: Release

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK from global.json
    inputs:
      useGlobalJson: true

  - script: dotnet restore eShop.slnx
    displayName: Restore

  - script: dotnet build eShop.slnx --configuration $(BuildConfiguration) --no-restore
    displayName: Build

  - script: dotnet test eShop.slnx --configuration $(BuildConfiguration) --no-build --logger trx
    displayName: Test

  - script: docker compose --env-file deploy/argus.env.example -f deploy/compose.yaml config --quiet
    displayName: Validate compose config
