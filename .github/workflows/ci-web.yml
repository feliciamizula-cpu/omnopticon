name: CI – Web Quick Build

on:
  push:
    branches: [main]
    paths:
      - 'src/Argus.Web/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/Argus.Web/**'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('global.json','**/*.csproj') }}
          restore-keys: nuget-
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and Build Argus.Web
        run: |
          dotnet restore src/Argus.Web/Argus.Web.csproj
          dotnet build src/Argus.Web/Argus.Web.csproj --configuration Release --no-restore
