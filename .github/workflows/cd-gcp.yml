name: CD - Deploy to GCP Staging

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: argus-web
      REGION: us-central1
      REPOSITORY: argus-staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build Docker image
        run: |
           docker buildx build \
              --build-arg GIT_SHA=${{ github.sha }} \
              --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
              --load \
              -t us-central1-docker.pkg.dev/project-30b3b95e-ed2b-4573-98a/argus-staging/argus-web:latest \
              -f deploy/Dockerfile.service .

      - name: Push Docker image
        run: |
           docker push us-central1-docker.pkg.dev/project-30b3b95e-ed2b-4573-98a/argus-staging/argus-web:latest

  deploy-cloudrun:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: argus-web
      REGION: us-central1
      SERVICE_NAME: argus-web-staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (staging)
        uses: google-github-actions/deploy-cloudrun@v0
        with:
          service: ${{ env.SERVICE_NAME }}
          image: us-central1-docker.pkg.dev/project-30b3b95e-ed2b-4573-98a/argus-staging/argus-web:latest
          region: ${{ env.REGION }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Staging
          allow_unauthenticated: true

      - name: Show service URL
        run: |
          echo "Service URL: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')"
