name: CD - Deploy to GKE

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: project-30b3b95e-ed2b-4573-98a
  REGION: us-central1
  CLUSTER_NAME: argus-gke
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  deploy-gke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker daemon
        run: |
          sudo systemctl start docker || sudo service docker start || true
          sleep 2
          docker info || true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Terraform init
        run: terraform -chdir=deploy/terraform init

      - name: Check if cluster exists
        id: cluster_check
        run: |
          if gcloud container clusters describe "${CLUSTER_NAME}" --region "${REGION}" --project "${PROJECT_ID}" 2>/dev/null; then
            echo "cluster_exists=true" >> $GITHUB_OUTPUT
          else
            echo "cluster_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Provision GKE infrastructure
        if: steps.cluster_check.outputs.cluster_exists != 'true'
        run: |
          terraform -chdir=deploy/terraform apply -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="cluster_name=${CLUSTER_NAME}" \
            -var="github_actions_service_account=${WIF_SERVICE_ACCOUNT}"

      - name: Configure kubectl
        run: gcloud container clusters get-credentials "${CLUSTER_NAME}" --region "${REGION}" --project "${PROJECT_ID}"

      - name: Restore deployment tools
        run: dotnet tool restore

      - name: Generate and push Aspire Kubernetes manifests
        working-directory: src/Argus.AppHost
        env:
          ARGUS_CONTAINER_REGISTRY: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/argus
          ARGUS_CONTAINER_TAG: ${{ github.sha }}
        run: aspirate generate --non-interactive --disable-secrets

      - name: Apply generated manifests and worker autoscaling
        run: |
          terraform -chdir=deploy/terraform apply -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="cluster_name=${CLUSTER_NAME}" \
            -var="apply_aspirate_manifests=true" \
            -var="aspirate_manifest_dir=../../src/Argus.AppHost/aspirate-output" \
            -var="github_actions_service_account=${WIF_SERVICE_ACCOUNT}"

      - name: Deployment summary
        run: |
          kubectl -n argus get deploy
          kubectl -n argus get hpa
