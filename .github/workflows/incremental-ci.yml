name: Incremental CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: Force all deployable projects through incremental build/test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: incremental-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect impacted services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
      full_topology: ${{ steps.detect.outputs.full_topology }}
      build_required: ${{ steps.detect.outputs.build_required }}
      selected_names: ${{ steps.detect.outputs.selected_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detector dependencies
        run: python -m pip install pyyaml

      - name: Validate service map
        run: python scripts/ci/validate-service-map.py

      - name: Detect impacted services
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild_all || false }}
        run: python scripts/ci/detect-impacted-services.py

  build-test:
    name: Build/test ${{ matrix.key }}
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore ${{ matrix.key }}
        run: dotnet restore "${{ matrix.project_path }}"

      - name: Build ${{ matrix.key }}
        run: dotnet build "${{ matrix.project_path }}" --configuration Release --no-restore

      - name: Run mapped tests
        shell: bash
        env:
          TESTS_JSON: ${{ toJson(matrix.tests) }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/argus-tests.txt
          import json, os
          for item in json.loads(os.environ.get("TESTS_JSON", "[]")):
              print(item)
          PY

          if [ ! -s /tmp/argus-tests.txt ]; then
            echo "No mapped tests for ${{ matrix.key }}"
            exit 0
          fi

          while IFS= read -r test_project; do
            echo "Running ${test_project}"
            dotnet test "${test_project}" --configuration Release --no-restore
          done < /tmp/argus-tests.txt

  full-validation:
    name: Full validation for topology/global changes
    needs: detect
    if: ${{ needs.detect.outputs.full_topology == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore eShop.slnx

      - name: Build solution
        run: dotnet build eShop.slnx --configuration Release --no-restore

      - name: Test solution
        run: dotnet test eShop.slnx --configuration Release --no-build

      - name: Validate Compose files
        run: |
          docker compose --env-file deploy/argus.env.example -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/argus.env.example -f deploy/compose.infra.yaml -f deploy/compose.apps.yaml -f deploy/compose.build.yaml config --quiet

  no-op:
    name: No impacted services
    needs: detect
    if: ${{ needs.detect.outputs.count == '0' && needs.detect.outputs.full_topology != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No deployable services were impacted."
