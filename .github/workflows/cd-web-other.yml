name: CD - Deploy Web Only (Other Server)

on:
  push:
    branches: [main]
    paths:
      - "src/Argus.Web/**"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ secrets.OTHER_PROJECT_ID }}
  REGION: ${{ secrets.OTHER_REGION }}
  CLUSTER_NAME: ${{ secrets.OTHER_CLUSTER_NAME }}
  REGISTRY: ${{ secrets.OTHER_REGISTRY }}
  DEPLOY_IMAGE_TAG: staging

concurrency:
  group: deploy-gke-web-only-other
  cancel-in-progress: false

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker build layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-web-
            ${{ runner.os }}-buildx-

      - name: Build and push Argus.Web image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.service \
            --build-arg PROJECT_PATH=src/Argus.Web/Argus.Web.csproj \
            --build-arg ASSEMBLY_NAME=Argus.Web \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/argus-web:buildcache \
            --cache-to type=registry,ref=${{ env.REGISTRY }}/argus-web:buildcache,mode=max \
            --tag ${{ env.REGISTRY }}/argus-web:${{ env.DEPLOY_IMAGE_TAG }} \
            --tag ${{ env.REGISTRY }}/argus-web:${{ github.sha }} \
            --push \
            .

      - name: Move cache for next run
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials "${{ env.CLUSTER_NAME }}" \
            --zone "${{ env.REGION }}-a" --project "${{ env.PROJECT_ID }}"

      - name: Deploy updated web image
        run: |
          IMAGE="${{ env.REGISTRY }}/argus-web:${{ github.sha }}"
          DEPLOYMENT="argus-web"
          CONTAINER="argus-web"
          kubectl -n argus set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${IMAGE}"
          kubectl -n argus rollout status "deployment/${DEPLOYMENT}" --timeout=180s

      - name: Verify web deployment health
        run: |
          kubectl -n argus wait --for=condition=available deployment/argus-web --timeout=120s
          echo "Web deployment is healthy"
