name: CD - Deploy to Cloud Run (Staging)

permissions:
  id-token: write
  contents: read
  actions: read

on:
  push:
    branches: [main]
    paths:
      - 'src/Argus.Web/**'
      - 'src/Argus.ServiceDefaults/**'
      - 'src/BuildingBlocks/**'
      - 'src/Contracts/**'
      - 'deploy/Dockerfile.service'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

env:
  PROJECT_ID: project-30b3b95e-ed2b-4573-98a
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/project-30b3b95e-ed2b-4573-98a/argus
  SERVICE_NAME: argus-web-staging
  DEV_VM_GATEWAY: http://34.63.95.161:8081

jobs:
  wait-for-gke-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.wait.outputs.image_tag }}
    steps:
      - name: Wait for GKE build workflow
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            
            // Wait up to 10 minutes for the GKE workflow to complete
            const maxAttempts = 60;
            const delayMs = 10000;
            
            for (let i = 0; i < maxAttempts; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'cd-gcp.yml',
                head_sha: sha,
                status: 'completed'
              });
              
              if (runs.data.workflow_runs.length > 0) {
                const run = runs.data.workflow_runs[0];
                if (run.conclusion === 'success') {
                  core.setOutput('image_tag', `${sha}`);
                  console.log(`GKE build completed successfully for ${sha}`);
                  return;
                } else {
                  core.setFailed(`GKE build failed with conclusion: ${run.conclusion}`);
                  return;
                }
              }
              
              console.log(`Waiting for GKE build... attempt ${i + 1}/${maxAttempts}`);
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }
            
            core.setFailed('Timeout waiting for GKE build');

  deploy:
    needs: wait-for-gke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGISTRY }}/argus-web:${{ needs.wait-for-gke-build.outputs.image_tag }}
          region: ${{ env.REGION }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Staging
            ARGUS_VERSION=${{ github.sha }}
            ARGUS_AGENT_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_PROGRAM_SCOPE_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_ASSET_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_ARTIFACT_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_FINDING_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_TASK_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_RATE_LIMIT_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_SCAN_ORCHESTRATOR_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_EVENT_ROUTER_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_REALTIME_SERVICE=${{ env.DEV_VM_GATEWAY }}
            ARGUS_PROXY_REGISTRY_SERVICE=${{ env.DEV_VM_GATEWAY }}
